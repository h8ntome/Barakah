name: Verify Barakah
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: barakah_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: barakah-ui/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: SQLite tests
        run: cd backend && python -m pytest -q
      - name: PostgreSQL tests
        run: cd backend && python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/barakah_test
      - run: npm ci --prefix barakah-ui
      - run: npm test --prefix barakah-ui
      - run: npm run build --prefix barakah-ui
      - name: Release tools and finance-reference checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s personal_finance/tests -v
          python -m unittest discover -s personal_finance/amendments -p 'test_*.py' -v
